<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#727CF5" />
      <stop offset="100%" stop-color="#4E54C8" />
    </linearGradient>

    <!-- Calendar Body Gradient -->
    <linearGradient id="calBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Calendar Header Gradient -->
    <linearGradient id="calHeadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5B5B" />
      <stop offset="100%" stop-color="#FF758C" />
    </linearGradient>

    <!-- Sprout Growth Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.28" />
    </filter>
    
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4" />

  <!-- Calendar Main Sheet with Shadow -->
  <g filter="url(#shadow)">
    <!-- White Card Background -->
    <rect x="96" y="112" width="320" height="304" rx="36" fill="url(#calBodyGrad)" />
    
    <!-- Top Red Header Bar -->
    <path d="M 96 148 C 96 128.118 112.118 112 132 112 L 380 112 C 399.882 112 416 128.118 416 148 L 416 188 L 96 188 Z" fill="url(#calHeadGrad)" />
  </g>

  <!-- Binder Rings -->
  <rect x="160" y="84" width="28" height="60" rx="14" fill="#E2E8F0" />
  <rect x="164" y="88" width="20" height="52" rx="10" fill="#FFFFFF" />

  <rect x="324" y="84" width="28" height="60" rx="14" fill="#E2E8F0" />
  <rect x="328" y="88" width="20" height="52" rx="10" fill="#FFFFFF" />

  <!-- Growth Sprout & Checkmark Symbolism in Center of Calendar -->
  <!-- Student Growth Leaf (Left) -->
  <path d="M 230 330 C 180 325 155 285 165 240 C 205 240 235 270 230 330 Z" fill="url(#leafGrad)" />
  <!-- Student Growth Leaf (Right) -->
  <path d="M 235 330 C 285 320 305 275 290 235 C 255 240 230 275 235 330 Z" fill="url(#leafGrad)" />
  <!-- Stem -->
  <path d="M 232 355 Q 232 320 232 300" stroke="#059669" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Golden Success Star / Sparkle at Top Right of Calendar -->
  <g filter="url(#badgeShadow)">
    <path d="M 350 210 L 358 232 L 382 232 L 362 246 L 370 268 L 350 254 L 330 268 L 338 246 L 318 232 L 342 232 Z" fill="url(#starGrad)" />
  </g>

  <!-- Mini Calendar Dots / Grid Indicator -->
  <circle cx="150" cy="360" r="8" fill="#CBD5E1" />
  <circle cx="190" cy="360" r="8" fill="#CBD5E1" />
  <circle cx="320" cy="360" r="8" fill="#CBD5E1" />
  <circle cx="360" cy="360" r="8" fill="#CBD5E1" />
</svg>
